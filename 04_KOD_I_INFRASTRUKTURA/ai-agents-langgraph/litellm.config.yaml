# LiteLLM proxy: jeden adres dla wszystkich agentów, routing tanich i drogich modeli.
# Budżety per agent ustawiamy jako virtual keys (LITELLM_KEY_*), nie tutaj.
# Nazwy modeli — sprawdzić aktualny cennik przed wdrożeniem (ADR-001, sekcja „Modele AI”).
model_list:
  - model_name: tani
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: kreatywny
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: analityczny
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  callbacks: ["langfuse"]   # wymaga LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY w env proxy

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
