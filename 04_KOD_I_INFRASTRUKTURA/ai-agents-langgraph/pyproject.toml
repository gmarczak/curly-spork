[project]
name = "fabryka-agents"
version = "0.1.0"
description = "Agenci AI fabryki JaGrzep: webhook Medusy, kolejka zadań, grafy LangGraph z akceptacją człowieka"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "arq>=0.26",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
postgres = ["langgraph-checkpoint-postgres>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabryka_agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
