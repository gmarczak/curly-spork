name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  agents:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 04_KOD_I_INFRASTRUKTURA/ai-agents-langgraph } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]" redis
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  medusa:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 04_KOD_I_INFRASTRUKTURA/medusa-backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: 04_KOD_I_INFRASTRUKTURA/medusa-backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:webhook

  storefront:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 04_KOD_I_INFRASTRUKTURA/storefront-nextjs } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: 04_KOD_I_INFRASTRUKTURA/storefront-nextjs/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }
